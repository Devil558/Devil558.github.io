<body>
<div class="box"><div class="logo">Doon Culture</div><p id="msg">App khul raha hai…</p></div>
<script>
(function(){
  var N = 11, parts = new Array(N), done = 0, failed = false;
  function tryWrite(){
    if (failed || done < N) return;
    var html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  }
  function fail(){
    if (failed) return; failed = true;
    document.getElementById('msg').textContent = 'Load nahi ho paya — internet check karke page dobara kholo.';
  }
  for (var i = 0; i < N; i++) {
    (function(idx){
      var name = 'parts/p' + (idx < 9 ? '0' : '') + (idx + 1) + '.txt';
      fetch(name).then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); }).then(function(t){ parts[idx] = t; done++; tryWrite(); }).catch(fail);
    })(i);
  }
})();
</script>
